name: CI

on:
  push:
    branches: ["**"]
  pull_request:

jobs:
  test:
    name: PHP ${{ matrix.php }}${{ matrix.label }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        # php-8.x branch: released PHP 8 versions.
        php: ['8.0', '8.1', '8.2', '8.3', '8.4', '8.5']
        extensions: ['bcmath, gmp, mbstring']
        include:
          # Without BCMath and GMP, big integers are compared in pure PHP
          # (validate_compare_bigint.phpt, skipped while GMP is loaded).
          - php: '8.5'
            extensions: 'mbstring, :bcmath, :gmp'
            label: ' without BCMath/GMP'

    steps:
      - uses: actions/checkout@v4

      - name: Set up PHP ${{ matrix.php }}
        uses: shivammathur/setup-php@v2
        with:
          php-version: ${{ matrix.php }}
          extensions: ${{ matrix.extensions }}
          coverage: none

      # Fail unless each extension is loaded, or not loaded if it has a ':'.
      - name: Check PHP and extensions
        env:
          EXTENSIONS: ${{ matrix.extensions }}
        run: |
          php -v
          mods=$(php -m)
          for e in $(echo "$EXTENSIONS" | tr ',' ' '); do
            if [ "${e#:}" = "$e" ]; then
              echo "$mods" | grep -qix "$e" || { echo "$e is not loaded"; exit 1; }
            elif echo "$mods" | grep -qix "${e#:}"; then
              echo "${e#:} is loaded"; exit 1
            fi
          done

      - name: Run tests
        run: cd src && php run-tests.php -p $(which php) --show-diff tests

  lint:
    name: phpcs
    runs-on: ubuntu-latest
    needs: test

    steps:
      - uses: actions/checkout@v4

      - name: Set up PHP 8.3
        uses: shivammathur/setup-php@v2
        with:
          php-version: '8.3'
          tools: cs2pr
          coverage: none

      - name: Install phpcs
        run: curl -sSfL https://squizlabs.github.io/PHP_CodeSniffer/phpcs.phar -o /usr/local/bin/phpcs && chmod +x /usr/local/bin/phpcs

      - name: Run phpcs
        run: phpcs --standard=src/phpcs.xml src/
