name: CI

on:
  push:
    branches: ["**"]
  pull_request:

jobs:
  test:
    name: PHP ${{ matrix.php }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        # php-7.x branch.
        php: ['7.0', '7.1', '7.2', '7.3', '7.4']

    steps:
      - uses: actions/checkout@v4

      - name: Set up PHP ${{ matrix.php }}
        uses: shivammathur/setup-php@v2
        with:
          php-version: ${{ matrix.php }}
          extensions: bcmath, gmp, mbstring
          coverage: none

      - name: Check PHP and extensions
        run: php -v && php -m | grep -E 'bcmath|gmp|mbstring'

      # run-tests.php of PHP 7.4 has no --show-diff; print the diffs on failure.
      - name: Run tests
        run: |
          cd src
          php run-tests.php -p $(which php) -q tests || { for f in tests/*.diff; do echo "=== $f"; cat "$f"; done; exit 1; }

  lint:
    name: phpcs
    runs-on: ubuntu-latest
    needs: test

    steps:
      - uses: actions/checkout@v4

      - name: Set up PHP 8.3
        uses: shivammathur/setup-php@v2
        with:
          php-version: '8.3'
          tools: cs2pr
          coverage: none

      - name: Install phpcs
        run: curl -sSfL https://squizlabs.github.io/PHP_CodeSniffer/phpcs.phar -o /usr/local/bin/phpcs && chmod +x /usr/local/bin/phpcs

      - name: Run phpcs
        run: phpcs --standard=src/phpcs.xml src/
