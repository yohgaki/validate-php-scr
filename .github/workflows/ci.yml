name: CI

on:
  push:
    branches: ["**"]
  pull_request:

jobs:
  test:
    name: PHP ${{ matrix.php }}${{ matrix.label }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        # master branch: released PHP 8 versions plus setup-php's builds of the
        # next PHP release ('nightly') and php-src master ('master').
        php: ['8.0', '8.1', '8.2', '8.3', '8.4', '8.5', 'nightly', 'master']
        extensions: ['bcmath, gmp, mbstring']
        include:
          # Without BCMath and GMP, big integers are compared in pure PHP
          # (validate_compare_bigint.phpt, skipped while GMP is loaded).
          - php: '8.5'
            extensions: 'mbstring, :bcmath, :gmp'
            label: ' without BCMath/GMP'

    steps:
      - uses: actions/checkout@v4

      - name: Set up PHP ${{ matrix.php }}
        uses: shivammathur/setup-php@v2
        with:
          php-version: ${{ matrix.php }}
          extensions: ${{ matrix.extensions }}
          coverage: none

      # Fail unless each extension is loaded, or not loaded if it has a ':'.
      - name: Check PHP and extensions
        env:
          EXTENSIONS: ${{ matrix.extensions }}
        run: |
          php -v
          mods=$(php -m)
          for e in $(echo "$EXTENSIONS" | tr ',' ' '); do
            if [ "${e#:}" = "$e" ]; then
              echo "$mods" | grep -qix "$e" || { echo "$e is not loaded"; exit 1; }
            elif echo "$mods" | grep -qix "${e#:}"; then
              echo "${e#:} is loaded"; exit 1
            fi
          done

      - name: Run tests
        run: cd src && php run-tests.php -p $(which php) --show-diff tests

  # 32-bit PHP (setup-php has none): the official image for linux/386, which
  # has mbstring but neither BCMath nor GMP.
  test-32bit:
    name: PHP 8.5 32-bit
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Run tests
        run: |
          docker run --rm --platform linux/386 -v "$PWD:/w" -w /w/src php:8.5-cli sh -c \
            'php -v && php -r "exit(PHP_INT_SIZE === 4 ? 0 : 1);" && php run-tests.php -p $(which php) --show-diff tests'

  lint:
    name: phpcs
    runs-on: ubuntu-latest
    needs: test

    steps:
      - uses: actions/checkout@v4

      - name: Set up PHP 8.3
        uses: shivammathur/setup-php@v2
        with:
          php-version: '8.3'
          tools: cs2pr
          coverage: none

      # PHP_CodeSniffer is maintained by PHPCSStandards (squizlabs.github.io
      # still serves the abandoned 3.7.2). A pinned release, checked against
      # the SHA-256 digest GitHub publishes for it.
      - name: Install phpcs
        env:
          PHPCS_VERSION: '3.13.6'
          PHPCS_SHA256: 'aed4148cee26285a73e694a98d4675b84f81ef86b2581f811d3c402c0d3d7d23'
        run: |
          curl -sSfL "https://github.com/PHPCSStandards/PHP_CodeSniffer/releases/download/$PHPCS_VERSION/phpcs.phar" -o /tmp/phpcs.phar
          echo "$PHPCS_SHA256  /tmp/phpcs.phar" | sha256sum -c -
          install -m 0755 /tmp/phpcs.phar /usr/local/bin/phpcs
          phpcs --version

      - name: Run phpcs
        run: phpcs --standard=src/phpcs.xml src/
