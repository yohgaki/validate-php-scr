stages:
  - test
  - lint

default:
  interruptible: true

# ── テストジョブ共通定義 ─────────────────────────────────────────────────────
# BCMath と GMP は公式イメージにないので、ビルドして入れる
.install_bcmath_gmp: &install_bcmath_gmp
  # 古いイメージの Debian は archive.debian.org にしか残っていない
  - |
    if ! apt-get update -qq; then
      codename=$(sed -n 's/^VERSION_CODENAME=//p' /etc/os-release)
      [ -n "$codename" ] || codename=$(sed -n 's/^VERSION=.*(\(.*\)).*/\1/p' /etc/os-release)
      echo "deb http://archive.debian.org/debian $codename main" > /etc/apt/sources.list
      rm -f /etc/apt/sources.list.d/*
      apt-get -o Acquire::Check-Valid-Until=false update -qq
    fi
  - apt-get install -y -qq libgmp-dev || apt-get install -y -qq --allow-unauthenticated libgmp-dev || apt-get install -y -qq --force-yes libgmp-dev
  - if [ ! -e /usr/include/gmp.h ]; then ln -s /usr/include/x86_64-linux-gnu/gmp.h /usr/include/gmp.h; fi
  - docker-php-ext-install -j$(nproc) bcmath gmp > /dev/null

# $EXTENSIONS の拡張がすべて読み込まれていることを確かめる。先頭に ':' がある拡張は、
# 読み込まれていないことを確かめる (.github/workflows/ci.yml と同じ)
.check_extensions: &check_extensions
  - |
    mods=$(php -m)
    for e in $(echo "$EXTENSIONS" | tr ',' ' '); do
      if [ "${e#:}" = "$e" ]; then
        echo "$mods" | grep -qix "$e" || { echo "$e is not loaded"; exit 1; }
      elif echo "$mods" | grep -qix "${e#:}"; then
        echo "${e#:} is loaded"; exit 1
      fi
    done

.test:
  stage: test
  variables:
    EXTENSIONS: "bcmath, gmp, mbstring"
  before_script:
    - php -v
    - *install_bcmath_gmp
    - *check_extensions
  script:
    - cd src && php run-tests.php -p $(which php) -q --show-diff tests
  artifacts:
    when: on_failure
    expire_in: 1 week
    paths:
      - src/tests/*.log

# ── PHP バージョンマトリクス ─────────────────────────────────────────────────
test:php7.0:
  extends: .test
  image: php:7.0-cli

test:php7.1:
  extends: .test
  image: php:7.1-cli

test:php7.2:
  extends: .test
  image: php:7.2-cli

test:php7.3:
  extends: .test
  image: php:7.3-cli

test:php7.4:
  extends: .test
  image: php:7.4-cli

# BCMath と GMP なしでもテストする。大きな整数を PHP だけで比較する経路を通す
# (validate_compare_bigint.phpt は GMP があると skip される)
test:php7.4-without-bcmath-gmp:
  extends: .test
  image: php:7.4-cli
  variables:
    EXTENSIONS: "mbstring, :bcmath, :gmp"
  before_script:
    - php -v
    - *check_extensions

# 32 ビット PHP。公式イメージの linux/386 版 (mbstring はあるが BCMath と GMP はない)
test:php7.4-i386:
  extends: .test
  image: i386/php:7.4-cli
  variables:
    EXTENSIONS: "mbstring, :bcmath, :gmp"
  before_script:
    - php -v
    - php -r 'exit(PHP_INT_SIZE === 4 ? 0 : 1);'
    - *check_extensions

# ── lint ─────────────────────────────────────────────────────────────────────
lint:phpcs:
  stage: lint
  image: php:8.3-cli
  needs:
    - test:php7.4
  # PHP_CodeSniffer は PHPCSStandards が保守している (squizlabs.github.io は放棄された
  # 3.7.2 のまま)。版を固定し、GitHub が公開している SHA-256 で照合する
  variables:
    PHPCS_VERSION: "3.13.6"
    PHPCS_SHA256: "aed4148cee26285a73e694a98d4675b84f81ef86b2581f811d3c402c0d3d7d23"
  before_script:
    - curl -sSfL "https://github.com/PHPCSStandards/PHP_CodeSniffer/releases/download/$PHPCS_VERSION/phpcs.phar" -o /tmp/phpcs.phar
    - echo "$PHPCS_SHA256  /tmp/phpcs.phar" | sha256sum -c -
    - install -m 0755 /tmp/phpcs.phar /usr/local/bin/phpcs
    - phpcs --version
  script:
    - phpcs --standard=src/phpcs.xml src/
